name: Release

# Pousser un tag vX.Y.Z (identique à __version__ dans foulee/__init__.py) publie
# l'installateur Windows sur GitHub Releases, que Vedware détecte ensuite.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Version
        id: v
        shell: bash
        run: |
          VERSION=$(python tools/get_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à __version__ ($VERSION)"
            exit 1
          fi

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean foulee.spec

      - name: Installateur Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=${{ steps.v.outputs.version }}" foulee.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = "dist\Foulee-Setup-${{ steps.v.outputs.version }}.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Foulee-Setup-${{ steps.v.outputs.version }}.exe" | Out-File -Encoding ascii "$exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Foulee-Setup-${{ steps.v.outputs.version }}
          path: dist/Foulee-Setup-*

      - name: Publication
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Foulee-Setup-${{ steps.v.outputs.version }}.exe
            dist/Foulee-Setup-${{ steps.v.outputs.version }}.exe.sha256
          generate_release_notes: true
